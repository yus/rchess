<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rchess · Classic with AI</title>
    <!-- link rel="stylesheet" href="../lib/rchess-style.css" -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
    <!-- Auto-load PGN data -->
    <script>
    // This will load after the main game loads
    window.addEventListener('load', function() {
        // Wait 2 seconds for game to initialize
        setTimeout(() => {
            if (typeof game !== 'undefined' && game) {
                importPGNFromRepo();
            }
        }, 2000);
    });
    </script>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
        }
        
        body {
            background: #1e4d1e;
            font-family: 'Segoe UI', system-ui;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .game-container {
            background: #2d5a2d;
            padding: 25px;
            border-radius: 28px;
            border: 2px solid #ebc28b;
            max-width: 1200px;
            width: 100%;
        }
        
        .game-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }
        
        /* ===== FIXED BOARD - FIREFOX COMPATIBLE ===== */
        .board-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }
        
        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: 560px;
        }
        
        /* Creates square aspect ratio using padding trick */
        .board-wrapper::before {
            content: '';
            display: block;
            padding-bottom: 100%; /* 1:1 = square */
        }
        
        .board {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 5px solid #4a3c31;
            border-radius: 8px;
            overflow: hidden;
            background: #b58863;
        }
        
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            font-size: clamp(20px, 4vw, 42px);
            user-select: none;
            -webkit-user-select: none;
            /* Firefox fix - prevent overflow */
            min-width: 0;
            min-height: 0;
            aspect-ratio: 1 / 1;
        }
        
        .square.light { background: #eed9b2; }
        .square.dark { background: #b58863; }
        
        .square.selected {
            outline: 4px solid #ffb703;
            outline-offset: -3px;
            filter: brightness(1.1);
            z-index: 1;
        }
        
        .square.valid-move::after {
            content: '';
            position: absolute;
            width: 25%;
            height: 25%;
            background: rgba(0, 200, 0, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        
        .square.last-move {
            background: rgba(255, 255, 0, 0.3) !important;
        }
        
        /* Firefox specific fixes */
        @-moz-document url-prefix() {
            .square {
                /* In Firefox, ensure flex works properly */
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 0;
                min-width: 0;
            }
            
            /* Fallback for Firefox if aspect-ratio fails */
            .square::before {
                content: '';
                display: block;
                padding-bottom: 100%;
                width: 0;
                height: 0;
                visibility: hidden;
                flex-shrink: 0;
            }
            
            .square .piece {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
            }
        }
        /* ===== END BOARD FIX ===== */
        
        /* ===== SIDEBAR ===== */
        .sidebar {
            background: #3b5e3b;
            border-radius: 18px;
            padding: 20px;
            color: white;
            border: 2px solid #6f8c5d;
            max-height: 90vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .learning-panel {
            margin-top: 20px;
            padding: 15px;
            background: #2d4d2d;
            border-radius: 15px;
        }
        
        .suggestion {
            background: #4a3c31;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #f5c542;
            cursor: pointer;
            transition: 0.2s;
        }
        .suggestion:hover {
            transform: scale(1.02);
            border-left-color: #ff6b6b;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .stat {
            text-align: center;
            background: #3b5e3b;
            padding: 10px;
            border-radius: 10px;
        }
        .stat .value {
            font-size: 24px;
            font-weight: bold;
            color: #ffde9e;
        }
        
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            background: #2d4d2d;
            color: white;
        }
        .mode-btn.active {
            background: #f5c542;
            color: #1e4d1e;
        }
        .mode-btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            background: #f5c542;
            color: #1e4d1e;
            transition: 0.2s;
        }
        button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        button.secondary {
            background: #6f8c5d;
            color: white;
        }
        button.danger {
            background: #c0392b;
            color: white;
        }
        
        .history-box {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .history-box h3 {
            margin-bottom: 10px;
        }
        #movesList {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        #movesList span {
            background: #2d4d2d;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .turn-indicator {
            font-size: 18px;
            padding: 10px;
            background: #2d4d2d;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .pattern-tag {
            display: inline-block;
            background: #4a3c31;
            padding: 3px 10px;
            border-radius: 15px;
            margin: 3px;
            font-size: 12px;
        }
        
        .mode-status {
            font-size: 14px;
            padding: 5px 10px;
            background: #2d4d2d;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        .color-indicator {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 14px;
            margin-left: 5px;
        }
        .color-white {
            background: #ffffff;
            color: #1e4d1e;
        }
        .color-black {
            background: #1a1a1a;
            color: white;
        }
        
        .ai-stats {
            background: #2d4d2d;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .ai-stats .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #3b5e3b;
        }
        .ai-stats .stat-item:last-child {
            border-bottom: none;
        }
        .stat-value {
            font-weight: bold;
            color: #ffde9e;
        }
        
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-group button {
            flex: 1;
        }
        
        .thinking {
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        /* ===== PROMOTION DIALOG ===== */
        .promotion-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .promotion-dialog.active {
            display: flex;
        }
        .promotion-options {
            background: #2d5a2d;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #ebc28b;
            display: flex;
            gap: 20px;
        }
        .promotion-btn {
            font-size: 60px;
            width: 80px;
            height: 80px;
            background: #eed9b2;
            border: 3px solid #4a3c31;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .promotion-btn:hover {
            transform: scale(1.1);
            border-color: #f5c542;
        }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d5a2d;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            border: 2px solid #ebc28b;
            display: none;
            z-index: 2000;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        .toast.success {
            border-color: #4CAF50;
        }
        .toast.warning {
            border-color: #ff9800;
        }
        .toast.error {
            border-color: #f44336;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(100px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        .file-indicator {
            background: #2d4d2d;
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 12px;
            border-left: 3px solid #ff9800;
        }
        .file-indicator.loaded {
            border-left-color: #4CAF50;
        }
        .file-indicator.missing {
            border-left-color: #ff9800;
        }
        
        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .game-layout {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .board-wrapper {
                max-width: 100%;
            }
            
            .sidebar {
                max-height: none;
            }
        }
        
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .game-container {
                padding: 15px;
            }
            
            .square {
                font-size: clamp(16px, 5vw, 28px);
            }
            
            .promotion-btn {
                font-size: 40px;
                width: 60px;
                height: 60px;
            }
            
            .mode-selector {
                flex-wrap: wrap;
            }
            
            .mode-btn {
                min-width: 60px;
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-layout">
            <div class="board-container">
                <div class="board-wrapper">
                    <div class="board" id="chessboard"></div>
                </div>
            </div>
            
            <div class="sidebar">
                <h2>♟️ Rchess Classic</h2>
                
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="ai" onclick="setMode('ai')">🤖 AI</button>
                    <button class="mode-btn" data-mode="learn" onclick="setMode('learn')">📚 Learn</button>
                </div>
                
                <div class="mode-status" id="modeStatus">Mode: AI</div>
                <div id="colorStatus" style="margin-top: 5px; font-size: 14px;">
                    You play: <span class="color-indicator color-white">♔ White</span>
                </div>
                
                <div class="turn-indicator" id="turnDisplay">⚪ Your turn</div>

                    <div class="stats">

                            <div class="value" id="totalGames">0</div>

                        🔍 Checking for saved files...
                    </div>

                <div class="btn-group">

                <button onclick="exportGame()" style="margin-top:10px; width:100%" class="secondary">💾 Save Game</button>
                <button onclick="exportAI()" style="margin-top:5px; width:100%" class="secondary">💾 Export AI Knowledge</button>
            </div>
        </div>
    </div>

    <!-- Promotion Dialog -->
    <div class="promotion-dialog" id="promotionDialog">
        <div class="promotion-options">
            <button class="promotion-btn" data-piece="q">♛</button>
            <button class="promotion-btn" data-piece="r">♜</button>
            <button class="promotion-btn" data-piece="b">♝</button>
            <button class="promotion-btn" data-piece="n">♞</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
    // ===== FULL JAVASCRIPT (same as before) =====
    class RchessGame {
        constructor() {
            this.chess = new Chess();
            this.mode = 'ai';
            this.selectedSquare = null;
            this.moveHistory = [];
            this.learner = new RchessLearner();
            this.pendingPromotion = null;
            this.gameOver = false;
            this.playerColor = Math.random() < 0.5 ? 'white' : 'black';
            this.aiColor = this.playerColor === 'white' ? 'black' : 'white';
            this.gameResult = null;
            this.isAIThinking = false;
            this.gameRecorded = false; // Track if game result was already recorded
            
            this.loadAutoSave();
            this.updateDisplay();
            
            if (this.mode === 'ai' && this.aiColor === 'white') {
                setTimeout(() => {
                    this.aiMove();
                }, 500);
            }
        }

        loadAutoSave() {
            const autoSave = localStorage.getItem('rchess_autosave');
            if (autoSave) {
                try {
                    const data = JSON.parse(autoSave);
                    if (data.moves && data.moves.length > 0 && !data.gameOver) {
                        this.chess = new Chess();
                        for (let move of data.moves) {
                            this.chess.move(move);
                        }
                        this.moveHistory = data.moves;
                        this.playerColor = data.playerColor || 'white';
                        this.aiColor = this.playerColor === 'white' ? 'black' : 'white';
                        this.gameOver = false;
                        this.gameRecorded = false;
                        showToast('🔄 Auto-saved game restored!', 'success');
                        return true;
                    }
                } catch (e) {
                    console.error('Failed to load auto-save:', e);
                }
            }
            return false;
        }

        autoSaveGame() {
            if (this.gameOver) {
                localStorage.removeItem('rchess_autosave');
                return;
            }
            const data = {
                moves: this.moveHistory,
                playerColor: this.playerColor,
                gameOver: this.gameOver,
                timestamp: Date.now()
            };
            localStorage.setItem('rchess_autosave', JSON.stringify(data));
        }

        getValidMoves(row, col) {
            const square = String.fromCharCode(97 + col) + (8 - row);
            const moves = this.chess.moves({ square: square, verbose: true });
            return moves.map(m => ({
                from: { row: 8 - parseInt(m.from[1]), col: m.from.charCodeAt(0) - 97 },
                to: { row: 8 - parseInt(m.to[1]), col: m.to.charCodeAt(0) - 97 },
                promotion: m.promotion
            }));
        }

        makeMove(from, to, promotion = 'q') {
            const fromSquare = String.fromCharCode(97 + from.col) + (8 - from.row);
            const toSquare = String.fromCharCode(97 + to.col) + (8 - to.row);
            
            try {
                const move = this.chess.move({ 
                    from: fromSquare, 
                    to: toSquare, 
                    promotion: promotion 
                });
                if (move) {
                    this.moveHistory.push(move.san);
                    this.selectedSquare = null;
                    this.recordPosition(move.san);
                    this.autoSaveGame();
                    this.updateDisplay();
                    return true;
                }
            } catch (e) {
                console.error('Invalid move:', e);
            }
            return false;
        }

        recordPosition(moveSan) {
            const hash = this.learner.hashPosition(this.chess.board());
            let pos = this.learner.db.positions.find(p => p.hash === hash);
            
            if (!pos) {
                pos = {
                    hash: hash,
                    moves: {},
                    games_played: 0,
                    wins: 0,
                    patterns: []
                };
                this.learner.db.positions.push(pos);
            }
            
            // Record the move
            if (moveSan) {
                if (!pos.moves[moveSan]) {
                    pos.moves[moveSan] = { played: 0, wins: 0 };
                }
                pos.moves[moveSan].played = (pos.moves[moveSan].played || 0) + 1;
            }
            
            this.learner.saveDatabase();
        }

        aiMove() {
            if (this.chess.game_over() || this.gameOver || this.isAIThinking) return;
            
            this.isAIThinking = true;
            document.getElementById('turnDisplay').textContent = '🤖 AI is thinking...';
            document.getElementById('turnDisplay').classList.add('thinking');
            
            setTimeout(() => {
                const moves = this.chess.moves({ verbose: true });
                if (moves.length === 0) {
                    this.isAIThinking = false;
                    document.getElementById('turnDisplay').classList.remove('thinking');
                    return;
                }
                
                let move = null;
                const hash = this.learner.hashPosition(this.chess.board());
                const pos = this.learner.db.positions.find(p => p.hash === hash);
                
                if (pos && Object.keys(pos.moves).length > 0) {
                    const moveStats = Object.entries(pos.moves)
                        .map(([moveSan, stats]) => ({
                            san: moveSan,
                            winRate: stats.wins / stats.played,
                            played: stats.played
                        }))
                        .sort((a, b) => b.winRate - a.winRate);
                    
                    for (let stat of moveStats) {
                        const found = moves.find(m => m.san === stat.san);
                        if (found) {
                            move = found;
                            break;
                        }
                    }
                }
                
                if (!move || Math.random() < 0.2) {
                    move = moves[Math.floor(Math.random() * moves.length)];
                }
                
                const result = this.chess.move(move);
                if (result) {
                    this.moveHistory.push(result.san);
                    this.recordPosition(result.san);
                    this.autoSaveGame();
                }
                
                this.isAIThinking = false;
                document.getElementById('turnDisplay').classList.remove('thinking');
                this.updateDisplay();
            }, 100);
        }

        updateDisplay() {
            const boardEl = document.getElementById('chessboard');
            boardEl.innerHTML = '';
            
            const board = this.chess.board();
            const history = this.chess.history({ verbose: true });
            const lastMove = history.length > 0 ? history[history.length - 1] : null;
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.row = r;
                    square.dataset.col = c;
                    
                    if (lastMove) {
                        const fromRow = 8 - parseInt(lastMove.from[1]);
                        const fromCol = lastMove.from.charCodeAt(0) - 97;
                        const toRow = 8 - parseInt(lastMove.to[1]);
                        const toCol = lastMove.to.charCodeAt(0) - 97;
                        if ((r === fromRow && c === fromCol) || (r === toRow && c === toCol)) {
                            square.classList.add('last-move');
                        }
                    }
                    
                    const piece = board[r][c];
                    if (piece) {
                        const symbols = {
                            w: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
                            b: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
                        };
                        square.textContent = symbols[piece.color][piece.type];
                    }
                    
                    if (this.selectedSquare?.row === r && this.selectedSquare?.col === c) {
                        square.classList.add('selected');
                    }
                    
                    if (this.selectedSquare) {
                        const validMoves = this.getValidMoves(this.selectedSquare.row, this.selectedSquare.col);
                        const isValidTarget = validMoves.some(m => m.to.row === r && m.to.col === c);
                        if (isValidTarget) {
                            square.classList.add('valid-move');
                        }
                    }
                    
                    square.addEventListener('click', () => this.handleClick(r, c));
                    boardEl.appendChild(square);
                }
            }
            
            // Update turn indicator
            const isPlayerTurn = this.chess.turn() === (this.playerColor === 'white' ? 'w' : 'b');
            const turnText = this.chess.turn() === 'w' ? '⚪ White' : '⚫ Black';
            
            if (this.isAIThinking) {
                document.getElementById('turnDisplay').textContent = '🤖 AI is thinking...';
            } else if (this.chess.game_over()) {
                // handled below
            } else {
                document.getElementById('turnDisplay').textContent = isPlayerTurn ? 
                    `👤 Your turn (${turnText})` : 
                    `🤖 AI's turn (${turnText})`;
            }
            
            // Update mode status
            const modeNames = { ai: '🤖 AI Mode', learn: '📚 Learn Mode' };
            document.getElementById('modeStatus').textContent = `Mode: ${modeNames[this.mode]}`;
            
            // Update color status
            const colorEmoji = this.playerColor === 'white' ? '♔' : '♚';
            const colorName = this.playerColor.charAt(0).toUpperCase() + this.playerColor.slice(1);
            document.getElementById('colorStatus').innerHTML = `
                You play: <span class="color-indicator color-${this.playerColor}">${colorEmoji} ${colorName}</span>
                <br><small>AI: ${this.aiColor}</small>
            `;
            
            // Update learning panel
            this.updateLearningPanel();
            
            // Update move history
            const movesList = document.getElementById('movesList');
            const historyMoves = this.chess.history();
            movesList.innerHTML = historyMoves.map((m, i) => 
                `<span>${i+1}. ${m}</span>`
            ).join('');
            
            // Check game over - ONLY ONCE
            if (this.chess.game_over() && !this.gameOver && !this.gameRecorded) {
                this.gameOver = true;
                let result = 'Draw';
                let winner = null;
                
                if (this.chess.in_checkmate()) {
                    const winningColor = this.chess.turn() === 'w' ? 'Black' : 'White';
                    result = `${winningColor} wins by checkmate!`;
                    winner = winningColor.toLowerCase();
                } else if (this.chess.in_stalemate()) {
                    result = 'Stalemate - Draw';
                    winner = 'draw';
                } else if (this.chess.in_threefold_repetition()) {
                    result = 'Draw by repetition';
                    winner = 'draw';
                } else if (this.chess.insufficient_material()) {
                    result = 'Draw - Insufficient material';
                    winner = 'draw';
                }
                
                document.getElementById('turnDisplay').textContent = `Game Over - ${result}`;
                this.gameResult = winner;
                this.gameRecorded = true;
                
                // Record the game result
                this.recordGameResult(winner);
                localStorage.removeItem('rchess_autosave');
            }
        }

        recordGameResult(result) {
            // Only record the result if we have moves
            if (this.moveHistory.length === 0) return;
            
            // Get all positions from the game with side information
            const tempChess = new Chess();
            const positionHistory = [];
            
            for (let i = 0; i < this.moveHistory.length; i++) {
                const moveSan = this.moveHistory[i];
                tempChess.move(moveSan);
                const hash = this.learner.hashPosition(tempChess.board());
                // The side that made the move
                const side = i % 2 === 0 ? 'white' : 'black';
                positionHistory.push({ hash, side, move: moveSan });
            }
            
            // Update each position based on result
            for (let pos of positionHistory) {
                const dbPos = this.learner.db.positions.find(p => p.hash === pos.hash);
                if (dbPos) {
                    // Only count positions where the AI made the move
                    if (pos.side === this.aiColor) {
                        dbPos.games_played = (dbPos.games_played || 0) + 1;
                        
                        // Check if AI won
                        const isAIWin = (result === 'white' && this.aiColor === 'white') ||
                                       (result === 'black' && this.aiColor === 'black');
                        
                        if (isAIWin) {
                            dbPos.wins = (dbPos.wins || 0) + 1;
                            // Also update the specific move's win rate
                            if (dbPos.moves[pos.move]) {
                                dbPos.moves[pos.move].wins = (dbPos.moves[pos.move].wins || 0) + 1;
                            }
                        }
                    }
                }
            }
            
            // Update global stats
            const stats = this.learner.db.stats;
            if (result === 'white') {
                stats.whiteWins = (stats.whiteWins || 0) + 1;
            } else if (result === 'black') {
                stats.blackWins = (stats.blackWins || 0) + 1;
            } else if (result === 'draw') {
                stats.draws = (stats.draws || 0) + 1;
            }
            stats.totalGames = (stats.totalGames || 0) + 1;
            
            this.learner.saveDatabase();
            this.updateLearningPanel();
        }

        updateLearningPanel() {
            const stats = this.learner.db.stats || { totalGames: 0, whiteWins: 0, blackWins: 0, draws: 0 };
            const totalGames = stats.totalGames || 0;
            const aiWins = this.aiColor === 'white' ? (stats.whiteWins || 0) : (stats.blackWins || 0);
            const humanWins = this.playerColor === 'white' ? (stats.whiteWins || 0) : (stats.blackWins || 0);
            
            document.getElementById('totalGames').textContent = totalGames;
            document.getElementById('aiWinRate').textContent = totalGames > 0 ? 
                Math.round((aiWins / totalGames) * 100) + '%' : '0%';
            document.getElementById('aiWins').textContent = aiWins;
            document.getElementById('humanWins').textContent = humanWins;
            document.getElementById('draws').textContent = stats.draws || 0;
            document.getElementById('positionsLearned').textContent = this.learner.db.positions.length;
            
            const hash = this.learner.hashPosition(this.chess.board());
            const pos = this.learner.db.positions.find(p => p.hash === hash);
            
            if (pos && Object.keys(pos.moves).length > 0) {
                const suggestions = Object.entries(pos.moves)
                    .map(([move, stats]) => ({
                        move: move,
                        winRate: stats.wins / stats.played,
                        played: stats.played
                    }))
                    .sort((a, b) => b.winRate - a.winRate)
                    .slice(0, 3);
                
                document.getElementById('moveSuggestions').innerHTML = suggestions.map(s => `
                    <div class="suggestion" onclick="playSuggestion('${s.move}')">
                        <strong>${s.move}</strong>
                        <div>Win rate: ${(s.winRate * 100).toFixed(1)}% (${s.played} games)</div>
                    </div>
                `).join('');
            } else {
                document.getElementById('moveSuggestions').innerHTML = '<p>No learning data yet for this position</p>';
            }
            
            const patterns = [];
            if (this.chess.in_check()) patterns.push('⚡ Check!');
            if (this.chess.in_checkmate()) patterns.push('♚ Checkmate!');
            if (this.chess.insufficient_material()) patterns.push('⚖️ Insufficient material');
            if (this.chess.in_stalemate()) patterns.push('⏸️ Stalemate');
            if (this.chess.in_threefold_repetition()) patterns.push('🔄 Repetition');
            
            document.getElementById('patternList').innerHTML = patterns.length ?
                patterns.map(p => `<span class="pattern-tag">${p}</span>`).join('') :
                '<p>No patterns detected</p>';
        }

        handleClick(row, col) {
            if (this.chess.game_over() || this.gameOver || this.isAIThinking) return;
            
            const isPlayerTurn = this.chess.turn() === (this.playerColor === 'white' ? 'w' : 'b');
            
            if (this.mode === 'ai') {
                if (!isPlayerTurn) return;
            }
            
            const square = String.fromCharCode(97 + col) + (8 - row);
            
            if (this.selectedSquare) {
                const fromSquare = String.fromCharCode(97 + this.selectedSquare.col) + (8 - this.selectedSquare.row);
                const toSquare = square;
                
                const piece = this.chess.get(fromSquare);
                const isPromotion = piece && piece.type === 'p' && (row === 0 || row === 7);
                
                if (isPromotion) {
                    this.pendingPromotion = { from: this.selectedSquare, to: { row, col } };
                    document.getElementById('promotionDialog').classList.add('active');
                    return;
                }
                
                const move = this.chess.move({ from: fromSquare, to: toSquare });
                if (move) {
                    this.moveHistory.push(move.san);
                    this.selectedSquare = null;
                    this.recordPosition();
                    this.autoSaveGame();
                    this.updateDisplay();
                    
                    if (this.mode === 'ai' && !this.chess.game_over()) {
                        setTimeout(() => {
                            this.aiMove();
                        }, 300);
                    }
                } else {
                    this.selectedSquare = null;
                    this.updateDisplay();
                }
            } else {
                const piece = this.chess.get(square);
                if (piece) {
                    const isCorrectColor = piece.color === (this.chess.turn() === 'w' ? 'w' : 'b');
                    if (isCorrectColor || this.mode === 'learn') {
                        this.selectedSquare = { row, col };
                        this.updateDisplay();
                    }
                }
            }
        }

        handlePromotion(piece) {
            if (!this.pendingPromotion) return;
            
            const { from, to } = this.pendingPromotion;
            const fromSquare = String.fromCharCode(97 + from.col) + (8 - from.row);
            const toSquare = String.fromCharCode(97 + to.col) + (8 - to.row);
            
            const move = this.chess.move({ 
                from: fromSquare, 
                to: toSquare, 
                promotion: piece 
            });
            
            if (move) {
                this.moveHistory.push(move.san);
                this.selectedSquare = null;
                this.pendingPromotion = null;
                document.getElementById('promotionDialog').classList.remove('active');
                this.recordPosition();
                this.autoSaveGame();
                this.updateDisplay();
                
                if (this.mode === 'ai' && !this.chess.game_over()) {
                    setTimeout(() => {
                        this.aiMove();
                    }, 300);
                }
            }
        }
    }

    class RchessLearner {
        constructor() {
            this.db = this.loadDatabase();
            this.loadExternalKnowledge();
        }

        loadDatabase() {
            let data = localStorage.getItem('rchess_db');
            if (data) {
                try {
                    return JSON.parse(data);
                } catch (e) {
                    console.error('Failed to parse database:', e);
                }
            }
            return { 
                positions: [], 
                stats: { totalGames: 0, whiteWins: 0, blackWins: 0, draws: 0 },
                games: [] 
            };
        }

        loadExternalKnowledge() {
            fetch('ai_knowledge.json')
                .then(response => {
                    if (!response.ok) {
                        return fetch('rchess_ai_knowledge.json');
                    }
                    return response;
                })
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error('No knowledge file found');
                })
                .then(data => {
                    if (data && data.positions) {
                        let loadedCount = 0;
                        for (let pos of data.positions) {
                            const existing = this.db.positions.find(p => p.hash === pos.hash);
                            if (!existing) {
                                this.db.positions.push(pos);
                                loadedCount++;
                            } else {
                                for (let [move, stats] of Object.entries(pos.moves)) {
                                    if (!existing.moves[move]) {
                                        existing.moves[move] = { played: 0, wins: 0 };
                                    }
                                    existing.moves[move].played += stats.played || 0;
                                    existing.moves[move].wins += stats.wins || 0;
                                }
                                existing.games_played = (existing.games_played || 0) + (pos.games_played || 0);
                                existing.wins = (existing.wins || 0) + (pos.wins || 0);
                            }
                        }
                        
                        if (data.stats) {
                            this.db.stats.totalGames = (this.db.stats.totalGames || 0) + (data.stats.totalGames || 0);
                            this.db.stats.whiteWins = (this.db.stats.whiteWins || 0) + (data.stats.whiteWins || 0);
                            this.db.stats.blackWins = (this.db.stats.blackWins || 0) + (data.stats.blackWins || 0);
                            this.db.stats.draws = (this.db.stats.draws || 0) + (data.stats.draws || 0);
                        }
                        
                        this.saveDatabase();
                        
                        document.getElementById('fileIndicator').className = 'file-indicator loaded';
                        document.getElementById('fileIndicator').innerHTML = 
                            `✅ Loaded AI knowledge (${loadedCount} new positions)`;
                        
                        showToast(`📚 Loaded ${loadedCount} positions from ai_knowledge.json`, 'success');
                    }
                })
                .catch(() => {
                    document.getElementById('fileIndicator').className = 'file-indicator missing';
                    document.getElementById('fileIndicator').innerHTML = 
                        '📁 No external knowledge file found. Using local data.';
                });
        }

        hashPosition(board) {
            let fen = '';
            for (let r = 0; r < 8; r++) {
                let empty = 0;
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        if (empty > 0) fen += empty;
                        fen += piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        empty = 0;
                    } else {
                        empty++;
                    }
                }
                if (empty > 0) fen += empty;
                if (r < 7) fen += '/';
            }
            return btoa(fen).slice(0, 8);
        }

        saveDatabase() {
            try {
                localStorage.setItem('rchess_db', JSON.stringify(this.db));
            } catch (e) {
                console.error('Failed to save database:', e);
            }
        }

        reset() {
            this.db = { 
                positions: [], 
                stats: { totalGames: 0, whiteWins: 0, blackWins: 0, draws: 0 },
                games: [] 
            };
            this.saveDatabase();
        }
    }

    let game;
    window.onload = () => {
        game = new RchessGame();
        game.updateDisplay();
        
        document.querySelectorAll('.promotion-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                game.handlePromotion(btn.dataset.piece);
            });
        });
        
        document.getElementById('promotionDialog').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('promotionDialog').classList.remove('active');
                game.pendingPromotion = null;
                game.selectedSquare = null;
                game.updateDisplay();
            }
        });
    };

    // ===== FIXED resetGame - preserves learner data =====
    function resetGame() {
        if (!game) return;
        
        // Preserve the learner data
        const learnerData = game.learner.db;
        
        // Reset the game state
        game.chess = new Chess();
        game.selectedSquare = null;
        game.moveHistory = [];
        game.pendingPromotion = null;
        game.gameOver = false;
        game.gameRecorded = false;
        game.gameResult = null;
        game.isAIThinking = false;
        
        // Randomize colors
        game.playerColor = Math.random() < 0.5 ? 'white' : 'black';
        game.aiColor = game.playerColor === 'white' ? 'black' : 'white';
        
        // Restore the learner data
        game.learner.db = learnerData;
        
        // Clear auto-save
        localStorage.removeItem('rchess_autosave');
        
        // Update display
        game.updateDisplay();
        document.getElementById('promotionDialog').classList.remove('active');
        showToast('🎲 New game started!', 'success');
        
        // If AI starts as white, make the first move
        if (game.mode === 'ai' && game.aiColor === 'white') {
            setTimeout(() => {
                game.aiMove();
            }, 500);
        }
    }

    function setMode(mode) {
        if (!game) return;
        game.mode = mode;
        game.selectedSquare = null;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        game.updateDisplay();
    }

    function resetAI() {
        if (confirm('Reset all AI learning data? This cannot be undone!')) {
            game.learner.reset();
            game.updateDisplay();
            showToast('🧠 AI knowledge reset successfully!', 'warning');
        }
    }

    function showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show ' + type;
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 4000);
    }

    function exportGame() {
        const gameData = {
            moves: game.moveHistory,
            result: game.gameResult || 'unknown',
            timestamp: new Date().toISOString(),
            playerColor: game.playerColor,
            aiColor: game.aiColor,
            mode: game.mode,
            version: '1.0'
        };

        const games = JSON.parse(localStorage.getItem('rchess_games') || '[]');
        games.push(gameData);
        localStorage.setItem('rchess_games', JSON.stringify(games));

        const blob = new Blob([JSON.stringify(gameData, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `game_${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);

        showToast('✅ Game saved! Place in repo alongside classic.html', 'success');
    }

    function exportAI() {
        const data = game.learner.db;
        data.timestamp = new Date().toISOString();
        data.version = '1.0';
        
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `ai_knowledge.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('✅ AI knowledge exported as ai_knowledge.json', 'success');
    }

    function playSuggestion(move) {
        if (!game || game.chess.game_over() || game.isAIThinking) return;
        
        const moves = game.chess.moves({ verbose: true });
        const found = moves.find(m => m.san === move);
        if (found) {
            const fromRow = 8 - parseInt(found.from[1]);
            const fromCol = found.from.charCodeAt(0) - 97;
            const toRow = 8 - parseInt(found.to[1]);
            const toCol = found.to.charCodeAt(0) - 97;
            game.handleClick(fromRow, fromCol);
            setTimeout(() => {
                game.handleClick(toRow, toCol);
            }, 100);
        }
    }    

    // ===== IMPROVED PGN PARSER =====
    function parsePGN(pgn) {
        const games = [];
        const gameLines = pgn.split('\n\n');
        
        for (let gameStr of gameLines) {
            if (gameStr.trim() === '') continue;
            
            // Extract result
            let result = 'draw';
            if (gameStr.includes('1-0')) result = 'white';
            else if (gameStr.includes('0-1')) result = 'black';
            
            // Extract moves
            const moves = [];
            const lines = gameStr.split('\n');
            let moveText = '';
            
            for (let line of lines) {
                if (!line.trim().startsWith('[')) {
                    moveText += line + ' ';
                }
            }
            
            // Parse move numbers (e.g., "1. e4 e5 2. Nf3 Nc6")
            const movePattern = /\d+\.\s*([^\d]+?)(?=\s*\d+\.|$)/g;
            let match;
            
            while ((match = movePattern.exec(moveText)) !== null) {
                const movePair = match[1].trim();
                const parts = movePair.split(/\s+/);
                
                for (let part of parts) {
                    if (part && !part.match(/^[0-9]+\./)) {
                        // Clean the move notation
                        const cleanMove = part.replace(/[+#?]/g, '').trim();
                        if (cleanMove) {
                            moves.push(cleanMove);
                        }
                    }
                }
            }
            
            if (moves.length > 0) {
                games.push({ moves, result });
            }
        }
        
        return games;
    }
    
    function processPGNGames(games) {
        if (!game) return;
        
        let processed = 0;
        let tempChess = new Chess();
        const startTime = Date.now();
        
        // Show progress
        showToast(`📊 Processing ${games.length} games...`, 'warning');
        
        let processedGames = 0;
        for (let gameData of games) {
            tempChess = new Chess();
            let moveCount = 0;
            
            for (let moveSan of gameData.moves) {
                try {
                    const move = tempChess.move(moveSan);
                    if (move) {
                        moveCount++;
                        const hash = game.learner.hashPosition(tempChess.board());
                        const side = moveCount % 2 === 1 ? 'white' : 'black';
                        
                        // Store in database
                        let pos = game.learner.db.positions.find(p => p.hash === hash);
                        if (!pos) {
                            pos = {
                                hash: hash,
                                moves: {},
                                games_played: 0,
                                wins: 0,
                                patterns: []
                            };
                            game.learner.db.positions.push(pos);
                        }
                        
                        if (!pos.moves[moveSan]) {
                            pos.moves[moveSan] = { played: 0, wins: 0 };
                        }
                        pos.moves[moveSan].played = (pos.moves[moveSan].played || 0) + 1;
                        pos.games_played = (pos.games_played || 0) + 1;
                        
                        if (gameData.result === side) {
                            pos.wins = (pos.wins || 0) + 1;
                            pos.moves[moveSan].wins = (pos.moves[moveSan].wins || 0) + 1;
                        }
                        
                        processed++;
                    }
                } catch (e) {
                    // Skip invalid moves
                    continue;
                }
            }
            
            processedGames++;
            
            // Show progress every 100 games
            if (processedGames % 100 === 0) {
                const elapsed = ((Date.now() - startTime) / 1000).toFixed(0);
                showToast(`📊 Processed ${processedGames}/${games.length} games (${processed} positions)`, 'warning');
            }
        }
        
        game.learner.saveDatabase();
        game.updateLearningPanel();
        
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
        showToast(`✅ Imported ${processed} positions from ${games.length} games in ${elapsed}s!`, 'success');
    }
    </script>
