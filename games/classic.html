<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rchess · Classic with AI</title>
    <!-- link rel="stylesheet" href="../lib/rchess-style.css" -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
    <style>
        body {
            background: #1e4d1e;
            font-family: 'Segoe UI', system-ui;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background: #2d5a2d;
            padding: 25px;
            border-radius: 28px;
            border: 2px solid #ebc28b;
            max-width: 1200px;
            width: 100%;
        }
        .game-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }
        .board-container {
            display: flex;
            justify-content: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 5px solid #4a3c31;
            border-radius: 8px;
            overflow: hidden;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            position: relative;
        }
        .square.light { background: #eed9b2; }
        .square.dark { background: #b58863; }
        .square.selected {
            outline: 4px solid #ffb703;
            outline-offset: -3px;
            filter: brightness(1.1);
        }
        .square.valid-move::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: rgba(0, 200, 0, 0.5);
            border-radius: 50%;
        }
        .square.last-move {
            background: rgba(255, 255, 0, 0.3) !important;
        }
        .sidebar {
            background: #3b5e3b;
            border-radius: 18px;
            padding: 20px;
            color: white;
            border: 2px solid #6f8c5d;
        }
        .learning-panel {
            margin-top: 20px;
            padding: 15px;
            background: #2d4d2d;
            border-radius: 15px;
        }
        .suggestion {
            background: #4a3c31;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #f5c542;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .stat {
            text-align: center;
            background: #3b5e3b;
            padding: 10px;
            border-radius: 10px;
        }
        .stat .value {
            font-size: 24px;
            font-weight: bold;
            color: #ffde9e;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            background: #2d4d2d;
            color: white;
        }
        .mode-btn.active {
            background: #f5c542;
            color: #1e4d1e;
        }
        .mode-btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            background: #f5c542;
            color: #1e4d1e;
            transition: 0.2s;
        }
        button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        button.secondary {
            background: #6f8c5d;
            color: white;
        }
        .history-box {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-box h3 {
            margin-bottom: 10px;
        }
        #movesList {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        #movesList span {
            background: #2d4d2d;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        .turn-indicator {
            font-size: 18px;
            padding: 10px;
            background: #2d4d2d;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }
        .pattern-tag {
            display: inline-block;
            background: #4a3c31;
            padding: 3px 10px;
            border-radius: 15px;
            margin: 3px;
            font-size: 12px;
        }
        /* Promotion Dialog */
        .promotion-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .promotion-dialog.active {
            display: flex;
        }
        .promotion-options {
            background: #2d5a2d;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #ebc28b;
            display: flex;
            gap: 20px;
        }
        .promotion-btn {
            font-size: 60px;
            width: 80px;
            height: 80px;
            background: #eed9b2;
            border: 3px solid #4a3c31;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .promotion-btn:hover {
            transform: scale(1.1);
            border-color: #f5c542;
        }
        .mode-status {
            font-size: 14px;
            padding: 5px 10px;
            background: #2d4d2d;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-layout">
            <div class="board-container">
                <div class="board" id="chessboard"></div>
            </div>
            
            <div class="sidebar">
                <h2>♟️ Rchess Classic</h2>
                
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="human" onclick="setMode('human')">👤 Human</button>
                    <button class="mode-btn" data-mode="ai" onclick="setMode('ai')">🤖 AI</button>
                    <button class="mode-btn" data-mode="learn" onclick="setMode('learn')">📚 Learn</button>
                </div>
                
                <div class="mode-status" id="modeStatus">Mode: Human</div>
                
                <div class="turn-indicator" id="turnDisplay">⚪ Your turn</div>
                
                <div class="learning-panel" id="learningPanel">
                    <h3>📊 Learning Stats</h3>
                    <div class="stats">
                        <div class="stat">
                            <div class="value" id="posGames">0</div>
                            <div>Games at position</div>
                        </div>
                        <div class="stat">
                            <div class="value" id="posWinRate">0%</div>
                            <div>Win rate</div>
                        </div>
                    </div>
                    
                    <div id="suggestionBox">
                        <h4>💡 Suggested Moves</h4>
                        <div id="moveSuggestions"></div>
                    </div>
                    
                    <div id="patternBox">
                        <h4>🔍 Detected Patterns</h4>
                        <div id="patternList"></div>
                    </div>
                </div>
                
                <div class="history-box">
                    <h3>📜 Move History</h3>
                    <div id="movesList"></div>
                </div>
                
                <button onclick="resetGame()" style="margin-top:20px; width:100%">🎲 New Game</button>
                <button onclick="exportGame()" style="margin-top:10px; width:100%" class="secondary">💾 Save Game</button>
            </div>
        </div>
    </div>

    <!-- Promotion Dialog -->
    <div class="promotion-dialog" id="promotionDialog">
        <div class="promotion-options">
            <button class="promotion-btn" data-piece="q">♛</button>
            <button class="promotion-btn" data-piece="r">♜</button>
            <button class="promotion-btn" data-piece="b">♝</button>
            <button class="promotion-btn" data-piece="n">♞</button>
        </div>
    </div>

    <script>
    class RchessGame {
        constructor() {
            this.chess = new Chess();
            this.humanColor = 'white';
            this.mode = 'human';
            this.selectedSquare = null;
            this.moveHistory = [];
            this.learner = new RchessLearner();
            this.pendingPromotion = null;
            this.gameOver = false;
            this.updateDisplay();
        }

        getValidMoves(row, col) {
            const square = String.fromCharCode(97 + col) + (8 - row);
            const moves = this.chess.moves({ square: square, verbose: true });
            return moves.map(m => ({
                from: { row: 8 - parseInt(m.from[1]), col: m.from.charCodeAt(0) - 97 },
                to: { row: 8 - parseInt(m.to[1]), col: m.to.charCodeAt(0) - 97 },
                promotion: m.promotion
            }));
        }

        makeMove(from, to, promotion = 'q') {
            const fromSquare = String.fromCharCode(97 + from.col) + (8 - from.row);
            const toSquare = String.fromCharCode(97 + to.col) + (8 - to.row);
            
            try {
                const move = this.chess.move({ 
                    from: fromSquare, 
                    to: toSquare, 
                    promotion: promotion 
                });
                if (move) {
                    this.moveHistory.push(move.san);
                    this.selectedSquare = null;
                    this.updateDisplay();
                    return true;
                }
            } catch (e) {
                console.error('Invalid move:', e);
            }
            return false;
        }

        aiMove() {
            if (this.chess.game_over() || this.gameOver) return;
            
            const moves = this.chess.moves({ verbose: true });
            if (moves.length === 0) return;
            
            let move = null;
            const suggestions = this.getSuggestions();
            
            if (suggestions.length > 0 && Math.random() < 0.7) {
                for (let suggestion of suggestions) {
                    const found = moves.find(m => m.san === suggestion.move);
                    if (found) {
                        move = found;
                        break;
                    }
                }
            }
            
            if (!move) {
                move = moves[Math.floor(Math.random() * moves.length)];
            }
            
            const result = this.chess.move(move);
            if (result) {
                this.moveHistory.push(result.san);
                this.updateDisplay();
            }
        }

        getSuggestions() {
            const hash = this.learner.hashPosition(this.chess.board());
            const pos = this.learner.db.positions.find(p => p.hash === hash);
            
            if (!pos) return [];
            
            return Object.entries(pos.moves)
                .map(([move, stats]) => ({
                    move: move,
                    winRate: stats.wins / stats.played,
                    played: stats.played
                }))
                .sort((a, b) => b.winRate - a.winRate)
                .slice(0, 3);
        }

        updateDisplay() {
            const boardEl = document.getElementById('chessboard');
            boardEl.innerHTML = '';
            
            const board = this.chess.board();
            const lastMove = this.moveHistory.length > 0 ? this.chess.history({ verbose: true }).pop() : null;
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.row = r;
                    square.dataset.col = c;
                    
                    // Highlight last move
                    if (lastMove) {
                        const fromRow = 8 - parseInt(lastMove.from[1]);
                        const fromCol = lastMove.from.charCodeAt(0) - 97;
                        const toRow = 8 - parseInt(lastMove.to[1]);
                        const toCol = lastMove.to.charCodeAt(0) - 97;
                        if ((r === fromRow && c === fromCol) || (r === toRow && c === toCol)) {
                            square.classList.add('last-move');
                        }
                    }
                    
                    const piece = board[r][c];
                    if (piece) {
                        const symbols = {
                            w: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
                            b: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
                        };
                        square.textContent = symbols[piece.color][piece.type];
                    }
                    
                    if (this.selectedSquare?.row === r && this.selectedSquare?.col === c) {
                        square.classList.add('selected');
                    }
                    
                    // Show valid moves
                    if (this.selectedSquare) {
                        const validMoves = this.getValidMoves(this.selectedSquare.row, this.selectedSquare.col);
                        const isValidTarget = validMoves.some(m => m.to.row === r && m.to.col === c);
                        if (isValidTarget) {
                            square.classList.add('valid-move');
                        }
                    }
                    
                    square.addEventListener('click', () => this.handleClick(r, c));
                    boardEl.appendChild(square);
                }
            }
            
            // Update turn indicator
            const turnText = this.chess.turn() === 'w' ? '⚪ White\'s turn' : '⚫ Black\'s turn';
            document.getElementById('turnDisplay').textContent = turnText;
            
            // Update mode status
            const modeNames = { human: '👤 Human', ai: '🤖 AI', learn: '📚 Learn' };
            document.getElementById('modeStatus').textContent = `Mode: ${modeNames[this.mode]}`;
            
            // Update learning panel
            this.updateLearningPanel();
            
            // Update move history
            const movesList = document.getElementById('movesList');
            const history = this.chess.history();
            movesList.innerHTML = history.map((m, i) => 
                `<span>${i+1}. ${m}</span>`
            ).join('');
            
            // Check game over
            if (this.chess.game_over() && !this.gameOver) {
                this.gameOver = true;
                let result = 'Draw';
                if (this.chess.in_checkmate()) {
                    result = this.chess.turn() === 'w' ? 'Black wins!' : 'White wins!';
                } else if (this.chess.in_stalemate()) {
                    result = 'Stalemate - Draw';
                } else if (this.chess.in_threefold_repetition()) {
                    result = 'Draw by repetition';
                } else if (this.chess.insufficient_material()) {
                    result = 'Draw - Insufficient material';
                }
                document.getElementById('turnDisplay').textContent = `Game Over - ${result}`;
            }
        }

        updateLearningPanel() {
            const hash = this.learner.hashPosition(this.chess.board());
            const pos = this.learner.db.positions.find(p => p.hash === hash);
            
            document.getElementById('posGames').textContent = pos?.games_played || 0;
            document.getElementById('posWinRate').textContent = pos ? 
                ((pos.wins / pos.games_played * 100).toFixed(1) + '%') : '0%';
            
            const suggestions = this.getSuggestions();
            const suggestionsHtml = suggestions.length ? suggestions.map(s => `
                <div class="suggestion">
                    <strong>${s.move}</strong>
                    <div>Win rate: ${(s.winRate * 100).toFixed(1)}% (${s.played} games)</div>
                </div>
            `).join('') : '<p>No data yet for this position</p>';
            
            document.getElementById('moveSuggestions').innerHTML = suggestionsHtml;
            
            const patterns = [];
            if (this.chess.in_check()) patterns.push('⚡ Check!');
            if (this.chess.in_checkmate()) patterns.push('♚ Checkmate!');
            if (this.chess.insufficient_material()) patterns.push('⚖️ Insufficient material');
            if (this.chess.in_stalemate()) patterns.push('⏸️ Stalemate');
            if (this.chess.in_threefold_repetition()) patterns.push('🔄 Repetition');
            
            document.getElementById('patternList').innerHTML = patterns.length ?
                patterns.map(p => `<span class="pattern-tag">${p}</span>`).join('') :
                '<p>No patterns detected</p>';
        }

        handleClick(row, col) {
            if (this.chess.game_over() || this.gameOver) return;
            
            // Check if it's human's turn
            const isHumanTurn = this.chess.turn() === (this.humanColor === 'white' ? 'w' : 'b');
            
            // In AI mode, only allow human moves when it's their turn
            if (this.mode === 'ai' && !isHumanTurn) {
                return;
            }
            
            // In learn mode, allow moves for both sides
            if (this.mode === 'learn') {
                // Allow moves for both sides
            }
            
            const square = String.fromCharCode(97 + col) + (8 - row);
            
            if (this.selectedSquare) {
                const fromSquare = String.fromCharCode(97 + this.selectedSquare.col) + (8 - this.selectedSquare.row);
                const toSquare = square;
                
                // Check if this is a promotion move
                const piece = this.chess.get(fromSquare);
                const isPromotion = piece && piece.type === 'p' && (row === 0 || row === 7);
                
                if (isPromotion) {
                    // Show promotion dialog
                    this.pendingPromotion = { from: this.selectedSquare, to: { row, col } };
                    document.getElementById('promotionDialog').classList.add('active');
                    return;
                }
                
                const move = this.chess.move({ from: fromSquare, to: toSquare });
                if (move) {
                    this.moveHistory.push(move.san);
                    this.selectedSquare = null;
                    this.updateDisplay();
                    
                    // In AI mode, trigger AI move
                    if (this.mode === 'ai' && !this.chess.game_over()) {
                        setTimeout(() => {
                            this.aiMove();
                            this.updateDisplay();
                        }, 300);
                    }
                } else {
                    this.selectedSquare = null;
                    this.updateDisplay();
                }
            } else {
                const piece = this.chess.get(square);
                if (piece) {
                    const isCorrectColor = piece.color === (this.chess.turn() === 'w' ? 'w' : 'b');
                    if (isCorrectColor || this.mode === 'learn') {
                        this.selectedSquare = { row, col };
                        this.updateDisplay();
                    }
                }
            }
        }

        handlePromotion(piece) {
            if (!this.pendingPromotion) return;
            
            const { from, to } = this.pendingPromotion;
            const fromSquare = String.fromCharCode(97 + from.col) + (8 - from.row);
            const toSquare = String.fromCharCode(97 + to.col) + (8 - to.row);
            
            const move = this.chess.move({ 
                from: fromSquare, 
                to: toSquare, 
                promotion: piece 
            });
            
            if (move) {
                this.moveHistory.push(move.san);
                this.selectedSquare = null;
                this.pendingPromotion = null;
                document.getElementById('promotionDialog').classList.remove('active');
                this.updateDisplay();
                
                if (this.mode === 'ai' && !this.chess.game_over()) {
                    setTimeout(() => {
                        this.aiMove();
                        this.updateDisplay();
                    }, 300);
                }
            }
        }

        recordGame(winner) {
            const gameData = {
                moves: this.moveHistory,
                winner: winner || 'draw',
                timestamp: new Date().toISOString()
            };
            this.learner.db.games.push(gameData);
            this.learner.saveDatabase();
        }
    }

    class RchessLearner {
        constructor() {
            this.db = this.loadDatabase();
        }

        loadDatabase() {
            let data = localStorage.getItem('rchess_db');
            return data ? JSON.parse(data) : { positions: [], games: [] };
        }

        hashPosition(board) {
            let fen = '';
            for (let r = 0; r < 8; r++) {
                let empty = 0;
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        if (empty > 0) fen += empty;
                        fen += piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        empty = 0;
                    } else {
                        empty++;
                    }
                }
                if (empty > 0) fen += empty;
                if (r < 7) fen += '/';
            }
            return btoa(fen).slice(0, 8);
        }

        saveDatabase() {
            localStorage.setItem('rchess_db', JSON.stringify(this.db));
        }
    }

    let game;
    window.onload = () => {
        game = new RchessGame();
        game.updateDisplay();
        
        // Promotion dialog handlers
        document.querySelectorAll('.promotion-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                game.handlePromotion(btn.dataset.piece);
            });
        });
        
        // Close promotion dialog on outside click
        document.getElementById('promotionDialog').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('promotionDialog').classList.remove('active');
                game.pendingPromotion = null;
                game.selectedSquare = null;
                game.updateDisplay();
            }
        });
    };

    function setMode(mode) {
        if (!game) return;
        game.mode = mode;
        game.selectedSquare = null;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        game.updateDisplay();
    }

    function resetGame() {
        game = new RchessGame();
        game.updateDisplay();
        document.getElementById('promotionDialog').classList.remove('active');
    }

    function exportGame() {
        let data = {
            moves: game.moveHistory,
            result: 'unknown',
            timestamp: new Date().toISOString()
        };
        let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `rchess_game_${Date.now()}.json`;
        a.click();
    }
    </script>
</body>
</html>
