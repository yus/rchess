<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rchess · Classic with AI</title>
    <link rel="stylesheet" href="../lib/rchess-styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
    <style>
        body {
            background: #1e4d1e;
            font-family: 'Segoe UI', system-ui;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            background: #2d5a2d;
            padding: 25px;
            border-radius: 28px;
            border: 2px solid #ebc28b;
            max-width: 1200px;
            width: 100%;
        }
        .game-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 20px;
        }
        .board-container {
            display: flex;
            justify-content: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            border: 5px solid #4a3c31;
            border-radius: 8px;
            overflow: hidden;
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            position: relative;
        }
        .square.light { background: #eed9b2; }
        .square.dark { background: #b58863; }
        .square.selected {
            outline: 4px solid #ffb703;
            outline-offset: -3px;
            filter: brightness(1.1);
        }
        .square.valid-move::after {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            background: rgba(0, 200, 0, 0.5);
            border-radius: 50%;
        }
        .square.last-move {
            background: rgba(255, 255, 0, 0.3) !important;
        }
        .sidebar {
            background: #3b5e3b;
            border-radius: 18px;
            padding: 20px;
            color: white;
            border: 2px solid #6f8c5d;
        }
        .learning-panel {
            margin-top: 20px;
            padding: 15px;
            background: #2d4d2d;
            border-radius: 15px;
        }
        .suggestion {
            background: #4a3c31;
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #f5c542;
            cursor: pointer;
            transition: 0.2s;
        }
        .suggestion:hover {
            transform: scale(1.02);
            border-left-color: #ff6b6b;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .stat {
            text-align: center;
            background: #3b5e3b;
            padding: 10px;
            border-radius: 10px;
        }
        .stat .value {
            font-size: 24px;
            font-weight: bold;
            color: #ffde9e;
        }
        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            background: #2d4d2d;
            color: white;
        }
        .mode-btn.active {
            background: #f5c542;
            color: #1e4d1e;
        }
        .mode-btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            background: #f5c542;
            color: #1e4d1e;
            transition: 0.2s;
        }
        button:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }
        button.secondary {
            background: #6f8c5d;
            color: white;
        }
        button.danger {
            background: #c0392b;
            color: white;
        }
        .history-box {
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-box h3 {
            margin-bottom: 10px;
        }
        #movesList {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        #movesList span {
            background: #2d4d2d;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        .turn-indicator {
            font-size: 18px;
            padding: 10px;
            background: #2d4d2d;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
        }
        .pattern-tag {
            display: inline-block;
            background: #4a3c31;
            padding: 3px 10px;
            border-radius: 15px;
            margin: 3px;
            font-size: 12px;
        }
        .promotion-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .promotion-dialog.active {
            display: flex;
        }
        .promotion-options {
            background: #2d5a2d;
            padding: 30px;
            border-radius: 20px;
            border: 3px solid #ebc28b;
            display: flex;
            gap: 20px;
        }
        .promotion-btn {
            font-size: 60px;
            width: 80px;
            height: 80px;
            background: #eed9b2;
            border: 3px solid #4a3c31;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .promotion-btn:hover {
            transform: scale(1.1);
            border-color: #f5c542;
        }
        .mode-status {
            font-size: 14px;
            padding: 5px 10px;
            background: #2d4d2d;
            border-radius: 10px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .color-indicator {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 14px;
            margin-left: 5px;
        }
        .color-white {
            background: #ffffff;
            color: #1e4d1e;
        }
        .color-black {
            background: #1a1a1a;
            color: white;
        }
        .ai-stats {
            background: #2d4d2d;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }
        .ai-stats .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #3b5e3b;
        }
        .ai-stats .stat-item:last-child {
            border-bottom: none;
        }
        .stat-value {
            font-weight: bold;
            color: #ffde9e;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-group button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-layout">
            <div class="board-container">
                <div class="board" id="chessboard"></div>
            </div>
            
            <div class="sidebar">
                <h2>♟️ Rchess Classic</h2>
                
                <div class="mode-selector">
                    <button class="mode-btn active" data-mode="ai" onclick="setMode('ai')">🤖 AI</button>
                    <button class="mode-btn" data-mode="learn" onclick="setMode('learn')">📚 Learn</button>
                </div>
                
                <div class="mode-status" id="modeStatus">Mode: AI</div>
                <div id="colorStatus" style="margin-top: 5px; font-size: 14px;">
                    You play: <span class="color-indicator color-white">♔ White</span>
                </div>
                
                <div class="turn-indicator" id="turnDisplay">⚪ Your turn</div>
                
                <div class="learning-panel">
                    <h3>📊 Learning Stats</h3>
                    <div class="stats">
                        <div class="stat">
                            <div class="value" id="totalGames">0</div>
                            <div>Total Games</div>
                        </div>
                        <div class="stat">
                            <div class="value" id="aiWinRate">0%</div>
                            <div>AI Win Rate</div>
                        </div>
                    </div>
                    
                    <div class="ai-stats">
                        <div class="stat-item">
                            <span>AI Wins</span>
                            <span class="stat-value" id="aiWins">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Human Wins</span>
                            <span class="stat-value" id="humanWins">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Draws</span>
                            <span class="stat-value" id="draws">0</span>
                        </div>
                        <div class="stat-item">
                            <span>Positions Learned</span>
                            <span class="stat-value" id="positionsLearned">0</span>
                        </div>
                    </div>
                    
                    <div id="suggestionBox">
                        <h4>💡 Suggested Moves</h4>
                        <div id="moveSuggestions"></div>
                    </div>
                    
                    <div id="patternBox">
                        <h4>🔍 Detected Patterns</h4>
                        <div id="patternList"></div>
                    </div>
                </div>
                
                <div class="history-box">
                    <h3>📜 Move History</h3>
                    <div id="movesList"></div>
                </div>
                
                <div class="btn-group">
                    <button onclick="resetGame()">🎲 New Game</button>
                    <button onclick="resetAI()" class="danger">🧠 Reset AI</button>
                </div>
                <button onclick="exportGame()" style="margin-top:10px; width:100%" class="secondary">💾 Save Game</button>
                <button onclick="exportAI()" style="margin-top:5px; width:100%" class="secondary">💾 Export AI Knowledge</button>
            </div>
        </div>
    </div>

    <!-- Promotion Dialog -->
    <div class="promotion-dialog" id="promotionDialog">
        <div class="promotion-options">
            <button class="promotion-btn" data-piece="q">♛</button>
            <button class="promotion-btn" data-piece="r">♜</button>
            <button class="promotion-btn" data-piece="b">♝</button>
            <button class="promotion-btn" data-piece="n">♞</button>
        </div>
    </div>

    <script>
    class RchessGame {
        constructor() {
            this.chess = new Chess();
            this.mode = 'ai';
            this.selectedSquare = null;
            this.moveHistory = [];
            this.learner = new RchessLearner();
            this.pendingPromotion = null;
            this.gameOver = false;
            this.playerColor = Math.random() < 0.5 ? 'white' : 'black';
            this.aiColor = this.playerColor === 'white' ? 'black' : 'white';
            this.gameResult = null;
            this.updateDisplay();
        }

        getValidMoves(row, col) {
            const square = String.fromCharCode(97 + col) + (8 - row);
            const moves = this.chess.moves({ square: square, verbose: true });
            return moves.map(m => ({
                from: { row: 8 - parseInt(m.from[1]), col: m.from.charCodeAt(0) - 97 },
                to: { row: 8 - parseInt(m.to[1]), col: m.to.charCodeAt(0) - 97 },
                promotion: m.promotion
            }));
        }

        makeMove(from, to, promotion = 'q') {
            const fromSquare = String.fromCharCode(97 + from.col) + (8 - from.row);
            const toSquare = String.fromCharCode(97 + to.col) + (8 - to.row);
            
            try {
                const move = this.chess.move({ 
                    from: fromSquare, 
                    to: toSquare, 
                    promotion: promotion 
                });
                if (move) {
                    this.moveHistory.push(move.san);
                    this.selectedSquare = null;
                    
                    // Record the position for learning
                    this.recordPosition();
                    
                    this.updateDisplay();
                    return true;
                }
            } catch (e) {
                console.error('Invalid move:', e);
            }
            return false;
        }

        recordPosition() {
            const hash = this.learner.hashPosition(this.chess.board());
            let pos = this.learner.db.positions.find(p => p.hash === hash);
            
            if (!pos) {
                pos = {
                    hash: hash,
                    moves: {},
                    games_played: 0,
                    wins: 0,
                    patterns: []
                };
                this.learner.db.positions.push(pos);
            }
            
            // Record the move that was just made
            const lastMove = this.moveHistory[this.moveHistory.length - 1];
            if (lastMove) {
                if (!pos.moves[lastMove]) {
                    pos.moves[lastMove] = { played: 0, wins: 0 };
                }
                pos.moves[lastMove].played++;
            }
            
            this.learner.saveDatabase();
        }

        aiMove() {
            if (this.chess.game_over() || this.gameOver) return;
            
            const moves = this.chess.moves({ verbose: true });
            if (moves.length === 0) return;
            
            let move = null;
            const hash = this.learner.hashPosition(this.chess.board());
            const pos = this.learner.db.positions.find(p => p.hash === hash);
            
            // Use learning if available
            if (pos && Object.keys(pos.moves).length > 0) {
                // Get moves with win rates
                const moveStats = Object.entries(pos.moves)
                    .map(([moveSan, stats]) => ({
                        san: moveSan,
                        winRate: stats.wins / stats.played,
                        played: stats.played
                    }))
                    .sort((a, b) => b.winRate - a.winRate);
                
                // Try to find a valid move from learned data
                for (let stat of moveStats) {
                    const found = moves.find(m => m.san === stat.san);
                    if (found) {
                        move = found;
                        break;
                    }
                }
            }
            
            // If no learned move found or exploration mode
            if (!move || Math.random() < 0.2) { // 20% exploration
                move = moves[Math.floor(Math.random() * moves.length)];
            }
            
            const result = this.chess.move(move);
            if (result) {
                this.moveHistory.push(result.san);
                this.recordPosition();
                this.updateDisplay();
            }
        }

        updateDisplay() {
            const boardEl = document.getElementById('chessboard');
            boardEl.innerHTML = '';
            
            const board = this.chess.board();
            const history = this.chess.history({ verbose: true });
            const lastMove = history.length > 0 ? history[history.length - 1] : null;
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    square.dataset.row = r;
                    square.dataset.col = c;
                    
                    if (lastMove) {
                        const fromRow = 8 - parseInt(lastMove.from[1]);
                        const fromCol = lastMove.from.charCodeAt(0) - 97;
                        const toRow = 8 - parseInt(lastMove.to[1]);
                        const toCol = lastMove.to.charCodeAt(0) - 97;
                        if ((r === fromRow && c === fromCol) || (r === toRow && c === toCol)) {
                            square.classList.add('last-move');
                        }
                    }
                    
                    const piece = board[r][c];
                    if (piece) {
                        const symbols = {
                            w: { k: '♔', q: '♕', r: '♖', b: '♗', n: '♘', p: '♙' },
                            b: { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' }
                        };
                        square.textContent = symbols[piece.color][piece.type];
                    }
                    
                    if (this.selectedSquare?.row === r && this.selectedSquare?.col === c) {
                        square.classList.add('selected');
                    }
                    
                    if (this.selectedSquare) {
                        const validMoves = this.getValidMoves(this.selectedSquare.row, this.selectedSquare.col);
                        const isValidTarget = validMoves.some(m => m.to.row === r && m.to.col === c);
                        if (isValidTarget) {
                            square.classList.add('valid-move');
                        }
                    }
                    
                    square.addEventListener('click', () => this.handleClick(r, c));
                    boardEl.appendChild(square);
                }
            }
            
            // Update turn indicator
            const turnText = this.chess.turn() === 'w' ? '⚪ White\'s turn' : '⚫ Black\'s turn';
            const isPlayerTurn = this.chess.turn() === (this.playerColor === 'white' ? 'w' : 'b');
            document.getElementById('turnDisplay').textContent = isPlayerTurn ? 
                `👤 Your turn (${turnText})` : 
                `🤖 AI thinking... (${turnText})`;
            
            // Update mode status
            const modeNames = { ai: '🤖 AI Mode', learn: '📚 Learn Mode' };
            document.getElementById('modeStatus').textContent = `Mode: ${modeNames[this.mode]}`;
            
            // Update color status
            const colorEmoji = this.playerColor === 'white' ? '♔' : '♚';
            const colorName = this.playerColor.charAt(0).toUpperCase() + this.playerColor.slice(1);
            document.getElementById('colorStatus').innerHTML = `
                You play: <span class="color-indicator color-${this.playerColor}">${colorEmoji} ${colorName}</span>
                <br><small>AI: ${this.aiColor}</small>
            `;
            
            // Update learning panel
            this.updateLearningPanel();
            
            // Update move history
            const movesList = document.getElementById('movesList');
            const historyMoves = this.chess.history();
            movesList.innerHTML = historyMoves.map((m, i) => 
                `<span>${i+1}. ${m}</span>`
            ).join('');
            
            // Check game over
            if (this.chess.game_over() && !this.gameOver) {
                this.gameOver = true;
                let result = 'Draw';
                if (this.chess.in_checkmate()) {
                    const winner = this.chess.turn() === 'w' ? 'Black' : 'White';
                    result = `${winner} wins by checkmate!`;
                    this.gameResult = winner.toLowerCase();
                } else if (this.chess.in_stalemate()) {
                    result = 'Stalemate - Draw';
                    this.gameResult = 'draw';
                } else if (this.chess.in_threefold_repetition()) {
                    result = 'Draw by repetition';
                    this.gameResult = 'draw';
                } else if (this.chess.insufficient_material()) {
                    result = 'Draw - Insufficient material';
                    this.gameResult = 'draw';
                }
                document.getElementById('turnDisplay').textContent = `Game Over - ${result}`;
                
                // Record game result for learning
                this.recordGameResult(this.gameResult);
            }
        }

        recordGameResult(result) {
            // Update all positions from the game
            const positions = [];
            const history = this.chess.history({ verbose: true });
            let tempChess = new Chess();
            
            // Record each position with the final result
            for (let move of history) {
                tempChess.move(move);
                const hash = this.learner.hashPosition(tempChess.board());
                positions.push(hash);
            }
            
            // Update learning database
            for (let hash of positions) {
                const pos = this.learner.db.positions.find(p => p.hash === hash);
                if (pos) {
                    pos.games_played++;
                    if (result === 'white' || result === 'black') {
                        // Determine if this position was good for the winning side
                        const winningColor = result;
                        // Simple heuristic: if position is from winning side's perspective
                        pos.wins += 1; // Increment wins for all positions in winning games
                    }
                }
            }
            
            // Update global stats
            if (result === 'white') {
                this.learner.db.stats.whiteWins = (this.learner.db.stats.whiteWins || 0) + 1;
            } else if (result === 'black') {
                this.learner.db.stats.blackWins = (this.learner.db.stats.blackWins || 0) + 1;
            } else {
                this.learner.db.stats.draws = (this.learner.db.stats.draws || 0) + 1;
            }
            this.learner.db.stats.totalGames = (this.learner.db.stats.totalGames || 0) + 1;
            
            this.learner.saveDatabase();
        }

        updateLearningPanel() {
            const stats = this.learner.db.stats || { totalGames: 0, whiteWins: 0, blackWins: 0, draws: 0 };
            const totalGames = stats.totalGames || 0;
            const aiWins = this.aiColor === 'white' ? (stats.whiteWins || 0) : (stats.blackWins || 0);
            const humanWins = this.playerColor === 'white' ? (stats.whiteWins || 0) : (stats.blackWins || 0);
            
            document.getElementById('totalGames').textContent = totalGames;
            document.getElementById('aiWinRate').textContent = totalGames > 0 ? 
                Math.round((aiWins / totalGames) * 100) + '%' : '0%';
            document.getElementById('aiWins').textContent = aiWins;
            document.getElementById('humanWins').textContent = humanWins;
            document.getElementById('draws').textContent = stats.draws || 0;
            document.getElementById('positionsLearned').textContent = this.learner.db.positions.length;
            
            // Current position suggestions
            const hash = this.learner.hashPosition(this.chess.board());
            const pos = this.learner.db.positions.find(p => p.hash === hash);
            
            if (pos && Object.keys(pos.moves).length > 0) {
                const suggestions = Object.entries(pos.moves)
                    .map(([move, stats]) => ({
                        move: move,
                        winRate: stats.wins / stats.played,
                        played: stats.played
                    }))
                    .sort((a, b) => b.winRate - a.winRate)
                    .slice(0, 3);
                
                document.getElementById('moveSuggestions').innerHTML = suggestions.map(s => `
                    <div class="suggestion" onclick="playSuggestion('${s.move}')">
                        <strong>${s.move}</strong>
                        <div>Win rate: ${(s.winRate * 100).toFixed(1)}% (${s.played} games)</div>
                    </div>
                `).join('');
            } else {
                document.getElementById('moveSuggestions').innerHTML = '<p>No learning data yet for this position</p>';
            }
            
            // Patterns
            const patterns = [];
            if (this.chess.in_check()) patterns.push('⚡ Check!');
            if (this.chess.in_checkmate()) patterns.push('♚ Checkmate!');
            if (this.chess.insufficient_material()) patterns.push('⚖️ Insufficient material');
            if (this.chess.in_stalemate()) patterns.push('⏸️ Stalemate');
            if (this.chess.in_threefold_repetition()) patterns.push('🔄 Repetition');
            
            document.getElementById('patternList').innerHTML = patterns.length ?
                patterns.map(p => `<span class="pattern-tag">${p}</span>`).join('') :
                '<p>No patterns detected</p>';
        }

        handleClick(row, col) {
            if (this.chess.game_over() || this.gameOver) return;
            
            const isPlayerTurn = this.chess.turn() === (this.playerColor === 'white' ? 'w' : 'b');
            
            // In AI mode, only allow player moves
            if (this.mode === 'ai') {
                if (!isPlayerTurn) return;
            }
            
            // In learn mode, allow moves for both sides
            if (this.mode === 'learn') {
                // Allow all moves
            }
            
            const square = String.fromCharCode(97 + col) + (8 - row);
            
            if (this.selectedSquare) {
                const fromSquare = String.fromCharCode(97 + this.selectedSquare.col) + (8 - this.selectedSquare.row);
                const toSquare = square;
                
                const piece = this.chess.get(fromSquare);
                const isPromotion = piece && piece.type === 'p' && (row === 0 || row === 7);
                
                if (isPromotion) {
                    this.pendingPromotion = { from: this.selectedSquare, to: { row, col } };
                    document.getElementById('promotionDialog').classList.add('active');
                    return;
                }
                
                const move = this.chess.move({ from: fromSquare, to: toSquare });
                if (move) {
                    this.moveHistory.push(move.san);
                    this.selectedSquare = null;
                    this.recordPosition();
                    this.updateDisplay();
                    
                    // In AI mode, trigger AI move
                    if (this.mode === 'ai' && !this.chess.game_over()) {
                        setTimeout(() => {
                            this.aiMove();
                            this.updateDisplay();
                        }, 300);
                    }
                } else {
                    this.selectedSquare = null;
                    this.updateDisplay();
                }
            } else {
                const piece = this.chess.get(square);
                if (piece) {
                    const isCorrectColor = piece.color === (this.chess.turn() === 'w' ? 'w' : 'b');
                    if (isCorrectColor || this.mode === 'learn') {
                        this.selectedSquare = { row, col };
                        this.updateDisplay();
                    }
                }
            }
        }

        handlePromotion(piece) {
            if (!this.pendingPromotion) return;
            
            const { from, to } = this.pendingPromotion;
            const fromSquare = String.fromCharCode(97 + from.col) + (8 - from.row);
            const toSquare = String.fromCharCode(97 + to.col) + (8 - to.row);
            
            const move = this.chess.move({ 
                from: fromSquare, 
                to: toSquare, 
                promotion: piece 
            });
            
            if (move) {
                this.moveHistory.push(move.san);
                this.selectedSquare = null;
                this.pendingPromotion = null;
                document.getElementById('promotionDialog').classList.remove('active');
                this.recordPosition();
                this.updateDisplay();
                
                if (this.mode === 'ai' && !this.chess.game_over()) {
                    setTimeout(() => {
                        this.aiMove();
                        this.updateDisplay();
                    }, 300);
                }
            }
        }
    }

    class RchessLearner {
        constructor() {
            this.db = this.loadDatabase();
        }

        loadDatabase() {
            let data = localStorage.getItem('rchess_db');
            if (data) {
                return JSON.parse(data);
            }
            return { 
                positions: [], 
                stats: { totalGames: 0, whiteWins: 0, blackWins: 0, draws: 0 },
                games: [] 
            };
        }

        hashPosition(board) {
            let fen = '';
            for (let r = 0; r < 8; r++) {
                let empty = 0;
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        if (empty > 0) fen += empty;
                        fen += piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        empty = 0;
                    } else {
                        empty++;
                    }
                }
                if (empty > 0) fen += empty;
                if (r < 7) fen += '/';
            }
            return btoa(fen).slice(0, 8);
        }

        saveDatabase() {
            localStorage.setItem('rchess_db', JSON.stringify(this.db));
        }

        reset() {
            this.db = { 
                positions: [], 
                stats: { totalGames: 0, whiteWins: 0, blackWins: 0, draws: 0 },
                games: [] 
            };
            this.saveDatabase();
        }
    }

    let game;
    window.onload = () => {
        game = new RchessGame();
        game.updateDisplay();
        
        document.querySelectorAll('.promotion-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                game.handlePromotion(btn.dataset.piece);
            });
        });
        
        document.getElementById('promotionDialog').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                document.getElementById('promotionDialog').classList.remove('active');
                game.pendingPromotion = null;
                game.selectedSquare = null;
                game.updateDisplay();
            }
        });
    };

    function setMode(mode) {
        if (!game) return;
        game.mode = mode;
        game.selectedSquare = null;
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === mode);
        });
        game.updateDisplay();
    }

    function resetGame() {
        game = new RchessGame();
        game.updateDisplay();
        document.getElementById('promotionDialog').classList.remove('active');
    }

    function resetAI() {
        if (confirm('Reset all AI learning data? This cannot be undone!')) {
            game.learner.reset();
            game.updateDisplay();
        }
    }

    function exportGame() {
        let data = {
            moves: game.moveHistory,
            result: game.gameResult || 'unknown',
            timestamp: new Date().toISOString(),
            playerColor: game.playerColor,
            aiColor: game.aiColor
        };
        let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `rchess_game_${Date.now()}.json`;
        a.click();
    }

    function exportAI() {
        let data = game.learner.db;
        let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = `rchess_ai_knowledge_${Date.now()}.json`;
        a.click();
    }

    function playSuggestion(move) {
        if (!game || game.chess.game_over()) return;
        
        // Parse the move notation and make it
        const moves = game.chess.moves({ verbose: true });
        const found = moves.find(m => m.san === move);
        if (found) {
            const fromRow = 8 - parseInt(found.from[1]);
            const fromCol = found.from.charCodeAt(0) - 97;
            const toRow = 8 - parseInt(found.to[1]);
            const toCol = found.to.charCodeAt(0) - 97;
            game.handleClick(fromRow, fromCol);
            // Small delay then click the target
            setTimeout(() => {
                game.handleClick(toRow, toCol);
            }, 100);
        }
    }
    </script>
